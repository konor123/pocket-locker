name: Release

# 태그 푸시(v1.2.3 형식)하면 서명된 APK + 원클릭 업데이터 + 휴대용 adb를
# GitHub Release에 자동으로 올린다. 릴리스 설명은 CHANGELOG.md에서 가져온다.
#
# 릴리스 절차:
#   1. app/build.gradle.kts의 versionCode/versionName 올리기
#   2. CHANGELOG.md에 해당 버전 내용 작성
#   3. 커밋 후 태그: git tag vX.Y.Z && git push origin main vX.Y.Z

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 러너에 Android SDK가 미리 설치되어 있음 (ANDROID_SDK_ROOT)
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.10.2

      - name: Check tag matches versionName
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG" != "v$VER" ]; then
            echo "태그($TAG)와 versionName(v$VER)이 다릅니다"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 고정 서명 키 복원 (서명이 바뀌면 기존 설치와 업데이트가 실패하므로)
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocket-locker.keystore"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pocket-locker.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/pocket-locker-${TAG}.apk"
          cp tools/update-pocket-locker.bat release-assets/
          cd release-assets
          for os in windows darwin linux; do
            curl -sL -o "platform-tools-$os.zip" "https://dl.google.com/android/repository/platform-tools-latest-$os.zip"
          done
          ls -la

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk "/^## ${TAG}/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "릴리스 $TAG" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
            "release-assets/pocket-locker-${TAG}.apk" \
            release-assets/update-pocket-locker.bat \
            release-assets/platform-tools-windows.zip \
            release-assets/platform-tools-darwin.zip \
            release-assets/platform-tools-linux.zip
